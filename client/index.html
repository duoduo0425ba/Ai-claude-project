<!doctype html>
<html lang="zh-CN" data-style="anime">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 在 CSS 生效前设好明暗主题和界面风格，避免首屏先闪一下别的颜色。
      // 逻辑与 src/styles/appearance.js 保持一致
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('theme');
          var style = localStorage.getItem('uiStyle');
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (style === 'space' || style === 'classic') root.setAttribute('data-style', style);
        } catch (e) { /* 读不到就用默认外观 */ }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="一款可爱的零花钱记账管理App，帮你轻松管理每一笔收支" />
    <meta name="theme-color" content="#FFB7C5" />
    <title>🌸 零花钱记账</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
